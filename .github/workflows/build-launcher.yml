name: Build Client Launcher

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run manifest verification unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify launcher manifest (strict read-only)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-launcher-manifest.py
          git diff --exit-code

      - name: Determine whether Windows launcher build is required
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi

          if [[ -z "$base_ref" ]] || [[ "$base_ref" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base_ref" HEAD)"
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -Eq '^(OverlordsLauncher/|OverlordsLauncher\.Tests/|OverlordsLauncher\.sln|manifest\.json|dat-overlay/|addons/|plugins/|scripts/|tests/|\.github/workflows/build-launcher\.yml)'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No launcher/client/manifest files changed; skipping redundant Windows build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: verify-manifest
    if: needs.verify-manifest.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore OverlordsLauncher.sln

      - name: Build solution
        run: dotnet build OverlordsLauncher.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test OverlordsLauncher.sln -c Release --no-build --verbosity normal

      - name: Publish single-file Windows client launcher
        run: >
          dotnet publish OverlordsLauncher/OverlordsLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o publish/OverlordsLauncher

      - name: Package distributable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sampleConfig = @'
          {
            "ServerName": "OverlordsXI",
            "DefaultHost": "127.0.0.1",
            "UseHairpin": false,
            "LobbyPort": 54231,
            "SearchPort": 54002
          }
          '@
          Set-Content -Path "publish/OverlordsLauncher/overlords-server.example.json" -Value $sampleConfig -Encoding UTF8
          Compress-Archive -Path "publish/OverlordsLauncher/OverlordsLauncher.exe", "publish/OverlordsLauncher/overlords-server.example.json" -DestinationPath "OverlordsLauncher-win-x64.zip" -Force
          if (-not (Test-Path "publish/OverlordsLauncher/OverlordsLauncher.exe")) { throw "Missing OverlordsLauncher.exe" }
          if (-not (Test-Path "OverlordsLauncher-win-x64.zip")) { throw "Missing OverlordsLauncher-win-x64.zip" }

      - name: Upload launcher build artifact
        uses: actions/upload-artifact@v7
        with:
          name: OverlordsLauncher-win-x64
          retention-days: 14
          path: |
            publish/OverlordsLauncher/OverlordsLauncher.exe
            OverlordsLauncher-win-x64.zip

  publish-release:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download launcher build artifact
        uses: actions/download-artifact@v8
        with:
          name: OverlordsLauncher-win-x64
          path: release-assets

      - name: Verify release assets exist
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/publish/OverlordsLauncher/OverlordsLauncher.exe
          test -s release-assets/OverlordsLauncher-win-x64.zip

      - name: Publish GitHub Release on tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/publish/OverlordsLauncher/OverlordsLauncher.exe
            release-assets/OverlordsLauncher-win-x64.zip
