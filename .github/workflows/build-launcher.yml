name: Build Client Launcher

on:
  push:
    branches:
      - main
      - "fix/**"
      - "feat/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build-launcher-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') && github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify-manifest:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.changes.outputs.should_build }}
      should_build_crystaljobs: ${{ steps.changes.outputs.should_build_crystaljobs }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Run manifest verification unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Ashita Lua unit tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'lupa==2.8'
          python tests/run_soul_lua_tests.py

      - name: Verify launcher manifest (strict read-only)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-launcher-manifest.py
          git diff --exit-code

      - name: Determine whether Windows builds are required
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_build_crystaljobs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.event.pull_request.base.sha }}"
          else
            base_ref="${{ github.event.before }}"
          fi

          if [[ -z "$base_ref" ]] || [[ "$base_ref" == "0000000000000000000000000000000000000000" ]] || ! git cat-file -e "$base_ref^{commit}" 2>/dev/null; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
            echo "should_build_crystaljobs=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed="$(git diff --name-only "$base_ref" HEAD)"
          echo "Changed files:"
          echo "$changed"

          if echo "$changed" | grep -Eq '^(SoulspireLauncher/|SoulspireLauncher\.Tests/|SoulspireLauncher\.sln|manifest\.json|dat-overlay/|addons/|plugins/|native/crystaljobs/|scripts/|tests/|\.github/workflows/build-launcher\.yml)'; then
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          else
            echo "No launcher/client/manifest files changed; skipping redundant Windows launcher build."
            echo "should_build=false" >> "$GITHUB_OUTPUT"
          fi

          if echo "$changed" | grep -Eq '^(native/crystaljobs/.*\.(c|cc|cpp|cxx|h|hh|hpp|hxx|def|cmd|bat|ps1)|scripts/verify-crystaljobs-dll\.py|\.github/workflows/build-launcher\.yml)$'; then
            echo "should_build_crystaljobs=true" >> "$GITHUB_OUTPUT"
          else
            echo "No native/crystaljobs C++ source files changed; skipping crystaljobs.dll build."
            echo "should_build_crystaljobs=false" >> "$GITHUB_OUTPUT"
          fi

  build-and-test:
    needs: verify-manifest
    if: needs.verify-manifest.outputs.should_build == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore SoulspireLauncher.sln

      - name: Build solution
        run: dotnet build SoulspireLauncher.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test SoulspireLauncher.sln -c Release --no-build --verbosity normal

      - name: Publish single-file Windows client launcher
        run: >
          dotnet publish SoulspireLauncher/SoulspireLauncher.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishReadyToRun=true
          -o publish/SoulspireLauncher

      - name: Package distributable archive
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sampleConfig = @'
          {
            "ServerName": "SoulspireXI",
            "DefaultHost": "play.soulspirexi.com",
            "UseHairpin": false,
            "LobbyPort": 54231,
            "SearchPort": 54002
          }
          '@
          Set-Content -Path "publish/SoulspireLauncher/soulspire-server.example.json" -Value $sampleConfig -Encoding UTF8
          # Transitional compatibility copy so existing OverlordsLauncher.exe installs auto-update cleanly
          Copy-Item -Path "publish/SoulspireLauncher/SoulspireLauncher.exe" -Destination "publish/SoulspireLauncher/OverlordsLauncher.exe" -Force
          Compress-Archive -Path "publish/SoulspireLauncher/SoulspireLauncher.exe", "publish/SoulspireLauncher/soulspire-server.example.json" -DestinationPath "SoulspireLauncher-win-x64.zip" -Force
          if (-not (Test-Path "publish/SoulspireLauncher/SoulspireLauncher.exe")) { throw "Missing SoulspireLauncher.exe" }
          if (-not (Test-Path "publish/SoulspireLauncher/OverlordsLauncher.exe")) { throw "Missing compatibility OverlordsLauncher.exe" }
          if (-not (Test-Path "SoulspireLauncher-win-x64.zip")) { throw "Missing SoulspireLauncher-win-x64.zip" }

      - name: Upload launcher build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SoulspireLauncher-win-x64
          retention-days: 14
          path: |
            publish/SoulspireLauncher/SoulspireLauncher.exe
            publish/SoulspireLauncher/OverlordsLauncher.exe
            SoulspireLauncher-win-x64.zip

  build-crystaljobs:
    needs: verify-manifest
    if: needs.verify-manifest.outputs.should_build_crystaljobs == 'true'
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build and self-test crystaljobs.dll (Win32 / x86)
        shell: pwsh
        env:
          CRYSTALJOBS_KEEP_SELFTEST: "1"
        run: |
          $ErrorActionPreference = 'Continue'
          & cmd.exe /c "native\crystaljobs\build.cmd 2>&1" | Tee-Object -FilePath "crystaljobs-build.log"
          $rc = $LASTEXITCODE
          if ($rc -ne 0) {
            $tail = (Get-Content "crystaljobs-build.log" -Tail 40) -join "`n"
            foreach ($line in (Get-Content "crystaljobs-build.log" | Select-String -Pattern '(error |ERROR:|Assertion failed|fatal error)' | Select-Object -First 10)) {
              Write-Host "::error::$($line.Line)"
            }
            if (-not (Get-Content "crystaljobs-build.log" | Select-String -Pattern '(error |ERROR:|Assertion failed|fatal error)')) {
              Write-Host "::error::build.cmd exited with code $rc. Last lines: $tail"
            }
            exit $rc
          }

      - name: Verify built 32-bit binaries and write build metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Assert-Win32PE([string]$path) {
            if (-not (Test-Path $path)) { throw "Missing built binary: $path" }
            $bytes = [System.IO.File]::ReadAllBytes($path)
            if ($bytes.Length -lt 64 -or $bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) {
              throw "Invalid PE header (missing MZ) in $path"
            }
            $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
            $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 4)
            if ($machine -ne 0x014C) {
              throw ("Expected x86 (0x014C) PE machine type in $path, got 0x{0:X4}" -f $machine)
            }
            $hash = (Get-FileHash -Path $path -Algorithm SHA256).Hash.ToLowerInvariant()
            Write-Host "Verified 32-bit PE binary: $path ($($bytes.Length) bytes, sha256=$hash)"
            return @{ Size = $bytes.Length; Sha256 = $hash }
          }

          $dllInfo = Assert-Win32PE "plugins/ashita4/crystaljobs.dll"
          $testInfo = Assert-Win32PE "native/crystaljobs/selftest.exe"

          @(
            "commit_sha=${{ github.sha }}"
            "ref=${{ github.ref }}"
            "branch=${{ github.ref_name }}"
            "run_id=${{ github.run_id }}"
            "crystaljobs_dll_size=$($dllInfo.Size)"
            "crystaljobs_dll_sha256=$($dllInfo.Sha256)"
            "selftest_exe_size=$($testInfo.Size)"
            "selftest_exe_sha256=$($testInfo.Sha256)"
          ) | Set-Content -Path "crystaljobs-build-info.txt" -Encoding UTF8
          Get-Content "crystaljobs-build-info.txt"

      - name: Upload crystaljobs.dll and selftest.exe build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: crystaljobs-win-x86
          retention-days: 14
          path: |
            plugins/ashita4/crystaljobs.dll
            native/crystaljobs/selftest.exe
            crystaljobs-build-info.txt
            crystaljobs-build.log

  package-verified-launcher:
    needs: [verify-manifest, build-crystaljobs, build-and-test]
    if: needs.verify-manifest.outputs.should_build_crystaljobs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Download newly built crystaljobs-win-x86 artifact
        uses: actions/download-artifact@v8
        with:
          name: crystaljobs-win-x86
          path: ci-artifacts/crystaljobs

      - name: Download newly built SoulspireLauncher-win-x64 artifact
        uses: actions/download-artifact@v8
        with:
          name: SoulspireLauncher-win-x64
          path: ci-artifacts/launcher

      - name: Validate built 26-hook crystaljobs.dll (PE32, 21 exports, hooks, commit, freshness)
        shell: bash
        run: |
          set -euo pipefail
          python scripts/verify-crystaljobs-dll.py \
            ci-artifacts/crystaljobs/plugins/ashita4/crystaljobs.dll \
            --build-info ci-artifacts/crystaljobs/crystaljobs-build-info.txt \
            --expected-commit "${{ github.sha }}"

      - name: Stage verified DLL, regenerate manifest.json, and verify zero checksum drift
        shell: bash
        run: |
          set -euo pipefail
          cp -f ci-artifacts/crystaljobs/plugins/ashita4/crystaljobs.dll plugins/ashita4/crystaljobs.dll
          python scripts/update-launcher-manifest.py
          python scripts/verify-launcher-manifest.py
          python scripts/verify-crystaljobs-dll.py \
            plugins/ashita4/crystaljobs.dll \
            --build-info ci-artifacts/crystaljobs/crystaljobs-build-info.txt \
            --expected-commit "${{ github.sha }}" \
            --manifest manifest.json

      - name: Run full launcher Python and Lua regression suites against packaged workspace
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p "test_*.py" -v
          python -m pip install 'lupa==2.8'
          python tests/run_soul_lua_tests.py

      - name: Assemble verified distributable package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packaged-launcher/plugins/ashita4 packaged-launcher/addons/ashita4
          cp -f plugins/ashita4/crystaljobs.dll packaged-launcher/plugins/ashita4/crystaljobs.dll
          cp -R addons/ashita4/crystalsocket packaged-launcher/addons/ashita4/crystalsocket
          cp -f manifest.json packaged-launcher/manifest.json
          cp -f ci-artifacts/launcher/publish/SoulspireLauncher/SoulspireLauncher.exe packaged-launcher/SoulspireLauncher.exe
          cp -f ci-artifacts/launcher/publish/SoulspireLauncher/OverlordsLauncher.exe packaged-launcher/OverlordsLauncher.exe
          cp -f ci-artifacts/launcher/SoulspireLauncher-win-x64.zip packaged-launcher/SoulspireLauncher-win-x64.zip
          cp -f ci-artifacts/crystaljobs/crystaljobs-build-info.txt packaged-launcher/crystaljobs-build-info.txt
          DLL_SHA=$(sha256sum packaged-launcher/plugins/ashita4/crystaljobs.dll | awk '{print $1}')
          MANIFEST_SHA=$(sha256sum packaged-launcher/manifest.json | awk '{print $1}')
          cat > packaged-launcher/PACKAGE-VERIFICATION.txt <<EOF
          commit_sha=${{ github.sha }}
          ref=${{ github.ref }}
          run_id=${{ github.run_id }}
          crystaljobs_dll_sha256=${DLL_SHA}
          manifest_json_sha256=${MANIFEST_SHA}
          expected_hooks=27
          required_exports=21
          manifest_verified=true
          EOF
          cat packaged-launcher/PACKAGE-VERIFICATION.txt

      - name: Upload verified launcher package artifact
        uses: actions/upload-artifact@v7
        with:
          name: SoulspireXI-Verified-Package-win-x64
          retention-days: 14
          path: packaged-launcher/

  publish-release:
    needs: [build-and-test, build-crystaljobs]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download launcher build artifact
        uses: actions/download-artifact@v8
        with:
          name: SoulspireLauncher-win-x64
          path: release-assets

      - name: Verify release assets exist
        shell: bash
        run: |
          set -euo pipefail
          test -s release-assets/publish/SoulspireLauncher/SoulspireLauncher.exe
          test -s release-assets/publish/SoulspireLauncher/OverlordsLauncher.exe
          test -s release-assets/SoulspireLauncher-win-x64.zip

      - name: Publish GitHub Release on tag
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/publish/SoulspireLauncher/SoulspireLauncher.exe
            release-assets/publish/SoulspireLauncher/OverlordsLauncher.exe
            release-assets/SoulspireLauncher-win-x64.zip
            release-assets/SoulspireLauncher-win-x64.zip
